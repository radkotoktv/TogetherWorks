<main class="main">
 <div class="form">
  <p class="formtitle">Registration form</p>
  <form [formGroup]="regformgroup" (ngSubmit)="onSubmit()">
   <label for="first_name">First Name </label>
   <input type="text" formControlName="first_name" id="first_name"  class="inputfield"/>
   <label for="last_name">Last Name </label>
   <input type ="text" formControlName="last_name" id="last_name" class="inputfield"/>
   <select formControlName="gender" id="gender" class="inputfield">
        <option value="" disabled>Select a gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option> </select>
   <label for="username">Username </label>
   <input type="text" formControlName="username" id="username" class="inputfield"/>
   <label for="pass">Password </label>
   <input type="password" formControlName="password" id="pass" class="inputfield"/>
   <label for="age">Age </label>
   <input type="number" formControlName="age" id="age" class="inputfield"/>
   <label for="salary">Salary </label>
   <input type="number" formControlName="salary" id="salary" class="inputfield"/>
   <label for="salary">Email </label>
   <input type="text" formControlName="email" id="email" class="inputfield"/>
   <button type="submit" class="registerbtn" [disabled]="!regformgroup.valid">Register</button>
  </form>
  <a routerLink="../login" routerLinkActive="active" ariaCurrentWhenActive="page" class="bypass">Already have an account?</a>
  
 </div>
</main>
